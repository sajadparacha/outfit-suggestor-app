name: Test local (web + backend)

# Ship-critical local gate for publish-on-web. iOS stays on ./run_all_tests (Twin UI).
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-local-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (Jest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Jest
        env:
          CI: true
        run: npm test -- --watchAll=false --passWithNoTests

  backend:
    name: Backend (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-ci.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
      - name: pytest
        env:
          DATABASE_URL: "sqlite:///:memory:"
          WARDROBE_AI_MODEL: openai
        run: pytest -q --tb=short -o addopts=
