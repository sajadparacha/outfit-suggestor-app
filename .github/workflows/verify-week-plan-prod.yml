name: Verify week-plan prod save/restore

# One-shot live check for pinned_items persistence. Manual only.
on:
  workflow_dispatch:

concurrency:
  group: verify-week-plan-prod
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Week Planner save/restore + pins field
        env:
          TEST_USERNAME: ${{ secrets.PRODUCTION_TEST_USERNAME }}
          TEST_PASSWORD: ${{ secrets.PRODUCTION_TEST_PASSWORD }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          API_BASE_URL="${API_BASE_URL:-https://web-production-dfcf8.up.railway.app}"
          python3 - <<'PY'
          import json, os, sys, urllib.error, urllib.parse, urllib.request

          API = os.environ["API_BASE_URL"].rstrip("/")
          user = os.environ["TEST_USERNAME"]
          password = os.environ["TEST_PASSWORD"]

          def req(method, path, data=None, token=None, form=False):
              headers = {}
              body = None
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              if data is not None:
                  if form:
                      body = urllib.parse.urlencode(data).encode()
                      headers["Content-Type"] = "application/x-www-form-urlencoded"
                  else:
                      body = json.dumps(data).encode()
                      headers["Content-Type"] = "application/json"
              request = urllib.request.Request(API + path, data=body, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=60) as resp:
                      raw = resp.read().decode()
                      return resp.status, json.loads(raw) if raw else None
              except urllib.error.HTTPError as e:
                  raw = e.read().decode()
                  try:
                      payload = json.loads(raw) if raw else None
                  except Exception:
                      payload = raw
                  return e.code, payload

          status, login = req(
              "POST",
              "/api/auth/login",
              {"username": user, "password": password},
              form=True,
          )
          if status != 200 or not login or not login.get("access_token"):
              print(f"LOGIN_FAIL status={status}")
              sys.exit(1)
          token = login["access_token"]

          status, plan = req("GET", "/api/week-plan", token=token)
          print(f"GET_PLAN status={status}")
          if status != 200:
              print("GET_PLAN_FAIL")
              sys.exit(1)

          days = plan.get("days") or []
          print(f"DAYS={len(days)}")
          if not days or not all(isinstance(d, dict) and "pinned_items" in d for d in days):
              print("PINNED_ITEMS_FIELD=False")
              sys.exit(2)
          print("PINNED_ITEMS_FIELD=True")

          marker = {"shirt": 424242}
          original_pins = [dict(d.get("pinned_items") or {}) for d in days]
          body = {
              "reminder_time": plan.get("reminder_time") or "07:30",
              "timezone": plan.get("timezone") or "UTC",
              "shared_style": plan.get("shared_style") or "classic",
              "shared_season": plan.get("shared_season") or "all-season",
              "days": [],
          }
          for d in days:
              day = {
                  "day_of_week": d["day_of_week"],
                  "enabled": d.get("enabled", False),
                  "occasion": d.get("occasion") or "everyday",
                  "style": d.get("style") or "classic",
                  "use_wardrobe_only": d.get("use_wardrobe_only", True),
                  "pinned_items": dict(d.get("pinned_items") or {}),
              }
              if d["day_of_week"] == 0:
                  day["pinned_items"] = marker
                  day["enabled"] = True
              body["days"].append(day)

          status, saved = req("PUT", "/api/week-plan", body, token=token)
          print(f"PUT_PLAN status={status}")
          if status != 200:
              print("PUT_FAIL")
              sys.exit(3)
          mon = next(d for d in saved["days"] if d["day_of_week"] == 0)
          print(f"PUT_PINNED_OK={mon.get('pinned_items') == marker}")
          if mon.get("pinned_items") != marker:
              sys.exit(4)

          status, again = req("GET", "/api/week-plan", token=token)
          mon2 = next(d for d in again["days"] if d["day_of_week"] == 0)
          print(f"GET_PINNED_OK={mon2.get('pinned_items') == marker}")
          if mon2.get("pinned_items") != marker:
              sys.exit(5)

          body["days"][0]["pinned_items"] = original_pins[0] if original_pins else {}
          status, restored = req("PUT", "/api/week-plan", body, token=token)
          print(f"RESTORE_PUT status={status}")
          if status != 200:
              sys.exit(6)
          mon3 = next(d for d in restored["days"] if d["day_of_week"] == 0)
          print(f"RESTORED_OK={mon3.get('pinned_items') == (original_pins[0] if original_pins else {})}")
          print("WEEK_PLAN_SAVE_RESTORE=PASS")
          PY
